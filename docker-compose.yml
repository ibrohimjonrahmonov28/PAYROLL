services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-payroll_db}
      POSTGRES_USER: ${DB_USER:-payroll_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-payroll_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-payroll_user} -d ${DB_NAME:-payroll_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-ip7pd902uilruyv}
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: ${DB_NAME:-payroll_db}
      DB_USER: ${DB_USER:-payroll_user}
      DB_PASSWORD: ${DB_PASSWORD:-payroll_secure_pass}
      DB_HOST: db
      DB_PORT: 5432
      BOT_TOKEN: ${BOT_TOKEN:-}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://tezol.shop,https://www.tezol.shop}
      BONUS: ${BONUS:-0}
    volumes:
      - ./config:/app/config
      - ./accounts:/app/accounts
      - ./production:/app/production
      - ./screens:/app/screens
      - ./templates:/app/templates
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:


