<!-- Kun / Tun (Day / Night) Mode Toggle Button -->
<button type="button" onclick="togglePayrollTheme()"
    class="theme-toggle-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold transition border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-200 hover:text-white shadow-sm cursor-pointer select-none"
    title="Kun / Tun rejimini almashtirish">
    <i class="fa-solid fa-moon theme-icon-moon text-amber-400 text-xs"></i>
    <i class="fa-solid fa-sun theme-icon-sun text-amber-500 text-xs hidden"></i>
    <span class="theme-text text-xs font-semibold">Tun</span>
</button>
