{% comment %}Konteynerga biriktirish (skaner): 1) qutining stikeri, 2) konteyner QR; "Bekor qilish" rejimi — stiker yoki konteyner.{% endcomment %}
<section class="bg-slate-900 border border-cyan-800/60 rounded-2xl p-4 space-y-3">
    <div class="flex flex-wrap items-center justify-between gap-2">
        <h2 class="text-sm font-black uppercase text-white"><i class="fa-solid fa-link text-cyan-400 mr-1.5"></i>Konteynerga biriktirish</h2>
        <button type="button" id="unlink-toggle" onclick="toggleUnlink()" class="px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-xs font-bold text-rose-300">Bekor qilish rejimi</button>
    </div>
    <input id="link-input" autocomplete="off" placeholder="Avval qutining stikerini, keyin konteyner QR kodini uring"
        class="w-full px-4 py-3 rounded-2xl bg-slate-950 border-2 border-cyan-500/60 text-white text-lg focus:outline-none focus:border-cyan-400">
    <p id="link-state" class="text-sm font-bold text-cyan-200">1-qadam: qutining stikerini uring.</p>
    <div id="link-log" class="space-y-1.5 text-sm"></div>
</section>
<script>
    (function () {
        const input = document.getElementById('link-input');
        const stateEl = document.getElementById('link-state');
        let boxCode = null, unlinkMode = false;

        function log(ok, text) {
            const row = document.createElement('div');
            row.className = `px-3 py-2 rounded-xl border ${ok ? 'bg-emerald-950 border-emerald-800 text-emerald-200' : 'bg-rose-950 border-rose-800 text-rose-200'}`;
            row.textContent = text;
            const box = document.getElementById('link-log');
            box.prepend(row);
            while (box.children.length > 6) box.lastChild.remove();
        }

        function setState() {
            const btn = document.getElementById('unlink-toggle');
            btn.className = `px-3 py-1.5 rounded-lg border text-xs font-bold ${unlinkMode ? 'bg-rose-600 border-rose-500 text-white' : 'bg-slate-800 border-slate-700 text-rose-300'}`;
            stateEl.textContent = unlinkMode ? "Bekor qilish: qutining stikerini yoki konteynerni uring."
                : (boxCode ? `2-qadam: ${boxCode} uchun bo'sh katta konteynerni uring.` : '1-qadam: qutining stikerini uring.');
        }

        window.toggleUnlink = function () { unlinkMode = !unlinkMode; boxCode = null; setState(); input.focus(); };

        input.addEventListener('keydown', async (event) => {
            if (event.key !== 'Enter') return;
            const code = input.value.trim();
            input.value = '';
            if (!code) return;
            if (unlinkMode) {
                const r = await postJSON(`{% url 'meto_hub_flow_api_unlink' %}`, {code});
                log(r.ok, r.data.message || 'Xatolik');
                unlinkMode = false;
                setState();
                return;
            }
            if (!boxCode) {
                const r = await getJSON(`{% url 'meto_hub_flow_api_resolve' %}?code=${encodeURIComponent(code)}`);
                if (!r.ok) { log(false, r.data.message || 'Topilmadi'); return; }
                if (r.data.kind === 'container') {
                    log(false, `${r.data.code} (${r.data.state}${r.data.box ? ', ' + r.data.box : ''}) — avval qutining stikerini uring.`);
                    return;
                }
                if (r.data.cancelled) { log(false, `${r.data.box} bekor qilingan — yangi stikerni uring.`); return; }
                if (r.data.container) { log(false, `${r.data.box} allaqachon ${r.data.container} konteynerida.`); return; }
                boxCode = r.data.box;
                log(true, `Quti ${r.data.box} · pastal ${r.data.pastal} · ${r.data.razmer} · ${r.data.qty} dona`);
                setState();
                return;
            }
            const r = await postJSON(`{% url 'meto_hub_flow_api_link' %}`, {box: boxCode, container: code});
            log(r.ok, r.data.message || 'Xatolik');
            if (r.ok) boxCode = null;
            setState();
        });
    })();
</script>
